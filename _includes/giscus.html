{% assign giscus = site.giscus %}
{% if giscus.repo != empty and giscus.repo_id != empty and giscus.category_id != empty %}
  <div class="giscus-shell" data-giscus-container>
    <div class="giscus-lazy" id="giscus-lazy">
      <button class="button" type="button" onclick="loadGiscus()">加载留言区</button>
      <p class="meta">留言由 GitHub Discussions 提供，首次加载可能需要几秒钟。</p>
    </div>
    <script>
      (function () {
        var loaded = false;
        window.loadGiscus = function () {
          if (loaded) return;
          loaded = true;

          var placeholder = document.getElementById('giscus-lazy');
          if (placeholder) placeholder.textContent = '正在加载留言区…';

          var script = document.createElement('script');
          script.src = 'https://giscus.app/client.js';
          script.setAttribute('data-repo', '{{ giscus.repo }}');
          script.setAttribute('data-repo-id', '{{ giscus.repo_id }}');
          script.setAttribute('data-category', '{{ giscus.category | default: "Q&A" }}');
          script.setAttribute('data-category-id', '{{ giscus.category_id }}');
          script.setAttribute('data-mapping', 'pathname');
          script.setAttribute('data-strict', '1');
          script.setAttribute('data-reactions-enabled', '1');
          script.setAttribute('data-emit-metadata', '0');
          script.setAttribute('data-input-position', 'top');
          script.setAttribute('data-theme', 'transparent_dark');
          script.setAttribute('data-lang', 'zh-CN');
          script.setAttribute('crossorigin', 'anonymous');
          script.async = true;
          script.onload = function () {
            if (placeholder) placeholder.hidden = true;
          };
          document.querySelector('[data-giscus-container]').appendChild(script);
        };
      })();
    </script>
  </div>
{% else %}
  <div class="giscus-setup" role="status">
    <p class="giscus-setup-title">留言区正在准备中</p>
    <p>启用 GitHub Discussions 并完成 Giscus 配置后，留言框会在这里出现。</p>
    <div class="giscus-setup-actions">
      <a class="button" href="https://github.com/{{ giscus.repo }}/settings#features" target="_blank" rel="noopener noreferrer">启用 Discussions</a>
      <a class="button ghost" href="https://giscus.app/zh-CN" target="_blank" rel="noopener noreferrer">配置 Giscus</a>
    </div>
  </div>
{% endif %}
