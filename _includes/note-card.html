{% assign note = include.note %}
<article class="note-card">
  <div class="note-card-body">
    <h3><a href="{{ note.pdf_url | relative_url }}" target="_blank" rel="noopener">{{ note.title }}</a></h3>
    <p class="meta">
      {{ note.category_title }}{% if note.updated %} · 更新于 {{ note.updated }}{% endif %}{% if note.pdf_size %} · {{ note.pdf_size }}{% endif %}
    </p>
  </div>
  <p class="note-actions">
    <a class="button" href="{{ note.pdf_url | relative_url }}" target="_blank" rel="noopener">阅读 PDF</a>
    <a class="button ghost" href="{{ note.pdf_url | relative_url }}" download>下载</a>
    {% if note.tex_url %}<a class="button ghost" href="{{ note.tex_url | relative_url }}" download>TeX 源码</a>{% endif %}
  </p>
</article>
