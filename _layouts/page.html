---
layout: default
---
<article class="page">
  <header class="page-heading">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.display_title | default: page.title }}</h1>
    {% if page.description %}<p class="page-intro">{{ page.description }}</p>{% endif %}
  </header>
  <div class="page-body">{{ content }}</div>
</article>
