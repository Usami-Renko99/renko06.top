<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% assign asset_version = site.time | date: '%s' %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Atom" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/js/page-transitions.js' | relative_url }}?v={{ asset_version }}" defer></script>
    {% include mathjax.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳至正文</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">
          <span class="site-brand-mark" aria-hidden="true">✦</span>
          <span class="site-brand-text">
            <span class="site-brand-name">{{ site.title }}</span>
            <span class="site-brand-label">MATHEMATICS &amp; NOTES</span>
          </span>
        </a>
        {% include nav.html %}
      </div>
    </header>

    <main id="main-content" class="container page-content{% if page.layout == 'home' %} page-home{% endif %}" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-note">数学笔记与学习记录</p>
        <p><a href="https://icp.gov.moe/?keyword=20266068" target="_blank" rel="noopener noreferrer">萌ICP备20266068号</a></p>
      </div>
    </footer>

    {% include live2d.html %}

  </body>
</html>
