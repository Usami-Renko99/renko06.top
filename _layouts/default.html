<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% assign asset_version = site.time | date: '%s' %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Atom" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/js/page-transitions.js' | relative_url }}?v={{ asset_version }}" defer></script>
    {% include mathjax.html %}
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% include nav.html %}
      </div>
    </header>

    <main class="container page-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p><a href="https://icp.gov.moe/?keyword=20266068" target="_blank" rel="noopener noreferrer">萌ICP备20266068号</a></p>
      </div>
    </footer>

    {% include live2d.html %}

  </body>
</html>
