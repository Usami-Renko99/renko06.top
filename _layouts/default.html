<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% assign asset_version = site.time | date: '%s' %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }} Atom" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/js/page-transitions.js' | relative_url }}?v={{ asset_version }}" defer></script>
    {% include mathjax.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳至正文</a>
    <div class="site-shell">
      <aside class="site-aside">
        <a class="site-title" href="{{ '/' | relative_url }}">
          <span class="site-kicker">Renko 的</span>
          <span class="site-name">完美算数教室</span>
        </a>
        <p class="site-intro">主要关注数论、表示论与代数几何，收集数学笔记，也写一些学习记录和杂谈。</p>
        {% include nav.html %}
      </aside>

      <main id="main-content" class="page-content{% if page.layout == 'home' %} page-home{% endif %}" tabindex="-1">
        {{ content }}
        <footer class="site-footer">
          <p>数学笔记与学习记录</p>
          <p><a href="https://icp.gov.moe/?keyword=20266068" target="_blank" rel="noopener noreferrer">萌ICP备20266068号</a></p>
        </footer>
      </main>
    </div>

    {% include live2d.html %}

  </body>
</html>
